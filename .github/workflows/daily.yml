name: AI Daily Digest

# 毎日 JST 09:00（UTC 00:00）に実行。手動実行も可能。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# リポジトリへレポートをコミットするための書き込み権限
permissions:
  contents: write

jobs:
  digest:
    # ニュース配信を止めないため、常時利用できる GitHub 管理ランナーで実行する。
    # ASEL2 を使う完全版は研究室 LAN 内から `python main.py` で実行できる。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        # GitHub 管理ランナーから研究室 LAN の ASEL2 には接続できないため、
        # 定期版では RSS のニュース要約と論文の原文アブストラクトを生成する。
        run: python main.py --skip-enrichment

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ collectors/seen.json
          if ! git diff --staged --quiet; then
            git commit -m "digest: $(date -u +%Y-%m-%d)"
            git push
          fi
