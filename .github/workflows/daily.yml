name: AI Daily Digest

# 毎日 JST 09:00（UTC 00:00）に実行。手動実行も可能。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# リポジトリへレポートをコミットするための書き込み権限
permissions:
  contents: write

jobs:
  digest:
    # 研究室 LAN 上の ASEL2 に接続するため、LAN 内の self-hosted runner で実行する。
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check remote LLM
        run: python -c "from collectors.enrich import check_ollama; check_ollama()"

      - name: Run digest
        run: python main.py

      - name: Commit report
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ collectors/seen.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "digest: $date"
            git push
          }
